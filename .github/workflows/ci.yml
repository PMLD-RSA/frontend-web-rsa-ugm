name: CI Quality Gate

on:
  push:
    branches:
      - dev
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - dev
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint · Assets · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Audit duplicate assets
        run: pnpm run assets:audit

      - name: Build production bundle (includes TypeScript check)
        run: pnpm run build
        env:
          # Nilai dummy agar build tidak gagal karena env kosong di CI
          NEXT_PUBLIC_APP_NAME: "RSA UGM Water Monitor (CI)"
          CORE_BACKEND_URL: "http://localhost:8000"
